  function done(){say('وصلتنا رسالتك، شكرًا لك ❤️','ok');document.getElementById('cfm').value='';b.disabled=false}
  function viaForm(){try{var fr=document.getElementById('cfi');if(!fr){fr=document.createElement('iframe');fr.id='cfi';fr.name='cfi';fr.style.display='none';document.body.appendChild(fr)}
   var fm=document.createElement('form');fm.method='POST';fm.action=FORM.action;fm.target='cfi';fm.style.display='none';
   d.forEach(function(v,k){var i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;fm.appendChild(i)});
   document.body.appendChild(fm);fm.submit();setTimeout(function(){fm.remove()},3000);done()}catch(e){say('تعذّر الإرسال، جرّبي مرة تانية.','er');b.disabled=false}}
  if(window.fetch){fetch(FORM.action,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'application/x-www-form-urlencoded'},body:d.toString()}).then(done).catch(viaForm)}else viaForm();
 });
})();
</script>
<script>
(function(){
 var root=document.documentElement,b=document.getElementById('tg');if(!b)return;
 function isDark(){var t=root.getAttribute('data-theme');if(t==='dark')return true;if(t==='light')return false;return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
 function paint(){var d=isDark();b.textContent=d?'☀️':'🌙';b.setAttribute('aria-label',d?'الوضع النهاري':'الوضع الليلي')}
 try{var s=localStorage.getItem('lp_theme');if(s==='dark'||s==='light')root.setAttribute('data-theme',s)}catch(e){}
 paint();
 b.addEventListener('click',function(){var n=isDark()?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('lp_theme',n)}catch(e){}paint()});
})();
</script>
